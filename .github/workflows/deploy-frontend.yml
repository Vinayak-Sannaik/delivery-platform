name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "food-delivery-frontend/**"
      - ".github/workflows/deploy-frontend.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: food-delivery-frontend

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v6

      # --------------------------------------------------
      # Setup Node
      # --------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: food-delivery-frontend/package-lock.json

      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------
      # Verify API configuration
      # --------------------------------------------------
      - name: Verify API configuration
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "ERROR: VITE_API_BASE_URL is empty"
            exit 1
          fi

          echo "VITE_API_BASE_URL is configured"
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      # --------------------------------------------------
      # Build
      # --------------------------------------------------
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      # --------------------------------------------------
      # Configure SPA fallback
      # --------------------------------------------------
      - name: Configure SPA fallback
        run: cp dist/index.html dist/404.html

      # --------------------------------------------------
      # Setup GitHub Pages
      # --------------------------------------------------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # --------------------------------------------------
      # Upload build artifact
      # --------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: food-delivery-frontend/dist

      # --------------------------------------------------
      # Deploy
      # --------------------------------------------------
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4